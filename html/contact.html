<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact // Jennaya Horne</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>
    <nav>
        <div class="container nav-content">
            <div class="logo">JH//SYSTEM_V1.0</div>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="projects.html">PROJECTS</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
            <div id="system-clock">00:00:00</div>
        </div>
    </nav>

    <main class="container contact-main">
        <h1 class="glitch" data-text="SECURE_UPLINK">SECURE_UPLINK</h1>
        <p class="contact-subtitle">// ESTABLISH CONNECTION</p>
        <p class="contact-email-text">
            or reach me directly at
            <a href="mailto:jennayajch@gmail.com" class="contact-email-link">jennayajch@gmail.com</a>
        </p>

        <form action="https://formspree.io/f/xwvddgyr" method="POST">
            <div class="form-group">
                <label for="name">SENDER_ID</label>
                <input type="text" id="name" name="name" placeholder="Enter name..." required>
            </div>
            <div class="form-group">
                <label for="email">UPLINK_ADDR</label>
                <input type="email" id="email" name="email" placeholder="Enter email..." required>
            </div>
            <div class="form-group">
                <label for="message">ENCRYPTED_MESSAGE</label>
                <textarea id="message" name="message" rows="5" placeholder="Transmission details..."
                    required></textarea>
            </div>
            <button type="submit">TRANSMIT_DATA</button>
        </form>
        <div id="success-msg">//TRANSMISSION RECEIVED</div>

    </main>

    <script src="../.js/app.js"></script>
</body>

</html>
