<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card // Jennaya Horne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/card.css">
</head>

<body>
    <div class="card-wrapper">
        <div class="card">
            <!-- Left panel: your info -->
            <div class="card-left">
                <div class="card-logo">JH//SYSTEM_V1.0</div>
                <div class="card-name">Jennaya Horne</div>
                <div class="card-title">Software Engineer</div>
                <div class="card-divider"></div>
                <div class="card-tags">
                    <span class="tag">Python</span>
                    <span class="tag">C</span>
                    <span class="tag">C++</span>
                    <span class="tag">Java</span>
                    <span class="tag">Software</span>
                    <span class="tag">Embedded Systems</span>
                    <span class="tag">Machine Learning</span>
                </div>
            </div>

            <!-- Right panel: QR code -->
            <div class="card-right">
                <div class="qr-label">// SCAN_TO_CONNECT</div>
                <img class="qr-code"
                    src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://jennayac.github.io/webpage/&bgcolor=121216&color=00ff1e&margin=5"
                    alt="QR code linking to jennayac.github.io/webpage" />
                <div class="qr-url">jennayac.github.io/webpage</div>
            </div>

        </div>
    </div>
</body>

</html>
